[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "home-credit"
version = "0.1.0"
description = "Home Credit Default Risk — Kaggle competition solution"
requires-python = ">=3.11"
dependencies = [
    "pyspark>=3.5",
    "pandas>=2.0",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "shap>=0.45",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "kaggle>=1.6",
    "pyarrow>=17.0",
    "optuna>=4.0",
    "lightgbm>=4.6.0",
    "catboost>=1.2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/home_credit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
